name: Collect public references
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: syria-analysis collect-rss --limit 6
      - run: syria-analysis validate
      - run: syria-analysis build-context
      - run: syria-analysis export-graph --format json
      - run: syria-analysis coverage
      - run: policy-analysis --country SY ontology
      - run: policy-analysis --country SY ontology --format jsonld
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-before-commit-source-refresh
          path: |
            data/documents/
            exports/context.json
            exports/context.jsonl
            exports/evidence.json
            exports/coverage.json
            exports/political-context.json
            exports/political-context.jsonld
          retention-days: 14
