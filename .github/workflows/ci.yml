name: Validate research toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desk.lock
      - run: python -m pip install -e '.[dev,desk,test]'
      - run: syria-analysis validate
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check src/syria_analysis/desk tests/test_desk.py src/syria_analysis/media_assessment.py tests/test_media_assessment.py
      - run: python -m ruff format --check src/syria_analysis/desk tests/test_desk.py src/syria_analysis/media_assessment.py tests/test_media_assessment.py
      - run: syria-analysis build-context --output /tmp/context.json --jsonl /tmp/context.jsonl
      - run: syria-analysis coverage --output /tmp/coverage.json
      - run: policy-analysis --country SY ontology --format jsonld --output /tmp/political-context.jsonld
      - run: syria-analysis export-graph --format graphml --output /tmp/evidence.graphml
      - run: syria-analysis build-atlas --output /tmp/atlas/index.html
      - run: python scripts/build_showcase.py --output output/context-site
      - run: node --check src/syria_analysis/web/context.js
      - run: node --check src/syria_analysis/web/media-assessment.js
      - run: node --check src/syria_analysis/web/observations.js
      - run: policy-analysis validate-selection examples/historical-research/syria-events.json
      - run: policy-analysis validate-selection examples/historical-research/syria-country-context.json
      - run: syria-analysis brief --question "What does the Homs announcement establish?" --place area-homs-urban-recovery --output /tmp/brief.md
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag syria-desk:check .
      - name: Synthetic container smoke test (no deployment)
        run: |
          docker run --detach --name desk-check -p 127.0.0.1:8771:8000 -e SYRIA_DESK_ACCESS_KEY=test-only-not-a-deployment-key-00000000 -e SYRIA_DESK_SECURE_COOKIE=0 syria-desk:check
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8771/healthz && break || sleep 2; done
          curl --fail --silent http://127.0.0.1:8771/healthz
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8771/api/cases)" = 401
      - if: always()
        run: docker rm --force desk-check || true
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-desk.lock
      - run: python -m pip install --no-deps .
      - run: npm install --prefix /tmp/desk-browser @playwright/cli@0.1.22
      - name: Start synthetic local fixture server
        env:
          SYRIA_DESK_ACCESS_KEY: test-only-not-a-deployment-key-00000000
          SYRIA_DESK_DATABASE: /tmp/desk-browser.sqlite3
          SYRIA_DESK_SECURE_COOKIE: '0'
        run: |
          uvicorn syria_analysis.desk.app:create_app --factory --host 127.0.0.1 --port 8770 --no-access-log > /tmp/desk-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8770/healthz && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8770/healthz
      - run: node /tmp/desk-browser/node_modules/@playwright/cli/playwright-cli.js -s=desk-ci open http://127.0.0.1:8770 --browser=chrome
      - run: node /tmp/desk-browser/node_modules/@playwright/cli/playwright-cli.js -s=desk-ci run-code --filename=tests/desk-browser.js
      - name: Build and serve public context snapshot
        run: |
          python scripts/build_showcase.py
          python -m http.server 8766 --bind 127.0.0.1 --directory dist > /tmp/context-server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8766/ > /dev/null && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8766/ > /dev/null
      - run: node /tmp/desk-browser/node_modules/@playwright/cli/playwright-cli.js -s=context-ci open http://127.0.0.1:8766 --browser=chrome
      - run: node /tmp/desk-browser/node_modules/@playwright/cli/playwright-cli.js -s=context-ci run-code --filename=tests/context-browser.js
      - run: node /tmp/desk-browser/node_modules/@playwright/cli/playwright-cli.js -s=context-ci run-code --filename=tests/media-browser.js
      - run: node /tmp/desk-browser/node_modules/@playwright/cli/playwright-cli.js -s=context-ci run-code --filename=tests/observations-browser.js
      - run: node --check src/syria_analysis/desk/web/desk.js
      - run: npx --yes prettier@3.9.9 --check src/syria_analysis/desk/web tests/desk-browser.js src/syria_analysis/web/media-assessment.js src/syria_analysis/web/media-assessment.css tests/media-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-desk-browser-results
          path: output/playwright/
          retention-days: 7
