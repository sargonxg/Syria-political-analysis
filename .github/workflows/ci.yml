name: Validate research toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: syria-analysis validate
      - run: python -m unittest discover -s tests -v
      - run: syria-analysis build-context --output /tmp/context.json --jsonl /tmp/context.jsonl
      - run: syria-analysis export-graph --format graphml --output /tmp/evidence.graphml
      - run: syria-analysis build-atlas --output /tmp/atlas/index.html
      - run: syria-analysis brief --question "What does the Homs announcement establish?" --place area-homs-urban-recovery --output /tmp/brief.md
