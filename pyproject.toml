[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syria-political-analysis"
version = "0.2.0"
description = "Country-extensible public-source political analysis, beginning with Syria and the Middle East"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Giulio Catanzariti"}]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5", "PyLD>=2.0,<3"]

[project.scripts]
syria-analysis = "syria_analysis.cli:main"
policy-analysis = "syria_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
