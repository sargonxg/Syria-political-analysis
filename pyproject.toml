[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syria-political-analysis"
version = "0.1.0"
description = "Public-source evidence, context and briefing tools for political analysis of Syria"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Giulio Catanzariti"}]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]

[project.scripts]
syria-analysis = "syria_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
syria_analysis = ["web/*.html", "web/*.css", "web/*.js"]
